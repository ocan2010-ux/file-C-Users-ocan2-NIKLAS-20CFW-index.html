<!DOCTYPE html>
<html lang="de" manifest="cache.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKLAS CFW</title>
    <style>
        /* ==========================================================================
           CSS DESIGN (STYLE) - Perfekt zentrierter Dauerkreislauf
           ========================================================================== */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1117;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Unblockierbares PS4-Eingabefeld über die gesamte Oberfläche */
        .ps4-core-trigger {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            border: none;
            padding: 0;
            margin: 0;
            z-index: 999999;
            cursor: pointer;
            outline: none;
            color: transparent;
            text-shadow: 0 0 0 transparent;
        }

        /* Der dauerhafte Logo-Header */
        .logo-container {
            width: 100%;
            text-align: center;
            padding: 20px 0;
            background-color: #0b0e14;
            border-bottom: 1px solid #1a2333;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 800000;
        }

        .logo-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            font-family: 'Arial Black', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 900;
            font-size: 2.4rem; 
            letter-spacing: -1px;
        }

        /* Weichzeichner-Leuchten (Blur) hinter dem Logo */
        .logo-wrapper::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 110%;
            height: 70%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(0,0,0,0) 70%);
            filter: blur(10px);
            z-index: 0;
        }

        .logo-nik {
            background: linear-gradient(to bottom, #7dd3fc 0%, #38bdf8 40%, #0284c7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            z-index: 1;
        }

        .logo-las { color: #ffffff; position: relative; z-index: 1; margin-right: 4px; }
        .logo-line { display: inline-block; width: 3px; height: 34px; background-color: #38bdf8; box-shadow: 0 0 5px rgba(56, 189, 248, 0.5); position: relative; z-index: 1; }
        
        .logo-cfw {
            font-size: 0.75rem;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: bold;
            position: relative;
            z-index: 1;
            margin-left: 4px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            white-space: nowrap;
        }

        .text-left-container { 
            padding: 30px; 
            text-align: left; 
        }

        /* Goldgelbe Warnmeldung */
        .main-warning { 
            color: #dfb16c; 
            font-size: 1.2rem; 
            font-weight: bold; 
            margin-bottom: 8px; 
            letter-spacing: 0.3px;
        }
        
        .sub-warning { 
            color: #4b5563; 
            font-size: 0.9rem; 
        }

        .center-spinner-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Mattweißer, frei schwebender Bogen */
        .spinner {
            width: 45px;
            height: 45px;
            border: 3px solid transparent; 
            border-top: 3px solid #ffffff;  
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Der perfekt zentrierte Fehlerbildschirm unter dem dauerhaften Logo */
        .failed-screen-layout {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 600000;
        }

        .failed-text {
            color: #94a3b8; 
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Native Eingabe-Schnittstelle für unblockierbare Befehle -->
    <input type="text" id="ps4-native-trigger" class="ps4-core-trigger" autofocus readonly>

    <!-- Der permanente Header mit deinem Logo -->
    <header class="logo-container">
        <div class="logo-wrapper">
            <span class="logo-nik">NIK</span>
            <span class="logo-las">LAS</span>
            <span class="logo-line"></span>
            <span class="logo-cfw">CFW</span>
        </div>
    </header>

    <!-- ZUSTAND 1: Goldene Warnmeldung -->
    <div id="screen-warning" class="text-left-container">
        <div class="main-warning">NICHT UNTERSTÜTZT (unbekannt) -- X drücken oder tippen, um trotzdem zu starten</div>
        <div class="sub-warning">Firmware unbekannt · nicht in der Kernel-Tabelle dieses Builds</div>
    </div>

    <!-- Das Ladesymbol in der Mitte (Sichtbar während der 3 Sekunden Ladezeit) -->
    <div id="center-loader" class="center-spinner-container hidden">
        <div class="spinner"></div>
    </div>

    <!-- ZUSTAND 2: Der zentrierte Text unter dem Logo nach dem Laden -->
    <div id="screen-failed" class="failed-screen-layout hidden">
        <div class="failed-text">Konsole neu starten</div>
    </div>

    <!-- ==========================================================================
       JAVASCRIPT LOGIK (FUNKTION)
       ========================================================================== -->
    <script>
        const warningScreen = document.getElementById('screen-warning');
        const centerLoader = document.getElementById('center-loader');
        const failedScreen = document.getElementById('screen-failed');
        const nativeTrigger = document.getElementById('ps4-native-trigger');

        let currentStep = 2; // Startet im Bereitschaftsmodus für Klick/Controller

        // Unblockierbarer Fokus-Stabilisator für die PS4-Firmware
        function forceFocus() {
            if (currentStep === 2 && document.activeElement !== nativeTrigger) {
                nativeTrigger.focus();
            }
        }
        setInterval(forceFocus, 50);

        // Startfunktion: Wechselt von Warnung zu Ladekreis und dann zum finalen Text
        function startExploitSystem() {
            if (currentStep !== 2) return;
            currentStep = 3; // Blockiert Doppelklicks

            // HTML-Elemente umschalten
            warningScreen.classList.add('hidden');
            nativeTrigger.classList.add('hidden'); 
            nativeTrigger.blur();

            // Zeige den rotierenden Bogen
            centerLoader.classList.remove('hidden');

            // Exakt 3 Sekunden den Bogen drehen lassen, dann umschalten
            setTimeout(() => {
                centerLoader.classList.add('hidden'); // Entfernt den Ladekreis
                failedScreen.classList.remove('hidden'); // Zeigt „Konsole neu starten“ exakt in der Mitte

                // Automatischer Seiten-Neustart nach 5 Sekunden, um den Kreislauf endlos zu wiederholen
                setTimeout(() => {
                    window.location.reload(); 
                }, 5000);

            }, 3000);
        }

        // Native System-Core-Bindung für Maus, Controller (X) und Touch
        nativeTrigger.onkeydown = function(e) { startExploitSystem(); };
        nativeTrigger.onmousedown = function(e) { startExploitSystem(); };
        nativeTrigger.ontouchstart = function(e) { startExploitSystem(); };
        document.onclick = function(e) { if (currentStep === 2) startExploitSystem(); };
    </script>
</body>
</html>
